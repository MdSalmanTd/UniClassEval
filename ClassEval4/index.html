<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Register</title>
</head>
<body>
  <div class="container">
    <h1>Register</h1>
    <div class="input-group">
      <label for="Username">Username</label>
      <input type="text" id="Username" name="Username" placeholder="Enter Username">
    </div>

    <div class="input-group">
      <label for="Password">Password</label>
      <input type="password" id="Password" name="Password" placeholder="Enter password">
    </div>

    <div class="input-group">
      <label for="Input">Input Text Label</label>
      <input type="text" id="Input" name="Input" placeholder="Enter text">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="Checkbox" name="Checkbox">
      <span>Remember Me</span>
    </div>

    <div class="toggle-group">
      <label class="switch">
        <input type="checkbox" id="Toggle" name="Toggle">
        <span class="slider round"></span>
      </label>
      <span>Enable Notification</span>
    </div>

    <div class="radio-group">
      <div>
        <input type="radio" id="Radio1" name="RadioGroup">
        <span>Option 1</span>
      </div>
      <div>
        <input type="radio" id="Radio2" name="RadioGroup">
        <span>Option 2</span>
      </div>
      <div>
        <input type="radio" id="Radio3" name="RadioGroup">
        <span>Option 3</span>
      </div>
    </div>

    <div class="dropdown-group">
      <label for="dropdown">Dropdown Title</label>
      <select id="dropdown" name="dropdown">
        <option value="option1">Option1</option>
        <option value="option2">Option2</option>
        <option value="option3">Option3</option>
      </select>
    </div>

    <div class="button-group">
      <button type="button">Cancel</button>
      <button type="button"> <a href="./login.html">Next</a></button>
    </div>
  </div>
</body>
</html>
